#-------------------------------
# General Site Settings
# Site text (name, menu, intro, news) lives in _data/settings.yml.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://imenben.github.io" # the base hostname & protocol for your site


#-------------------------------
# Build Settings
markdown: kramdown
permalink: /:title
plugins:
  - jekyll-paginate
  - jekyll-sitemap

paginate: 8
paginate_path: "/blog/page/:num"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle


#-------------------------------
# Collections
collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /blog/:slug
  projects:
    output: true
    permalink: /research/:slug
  publications:
    output: false
  teaching:
    output: true
    permalink: /teaching/:slug

# Pages Path
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "page"

sass:
  style: compressed
