  projects_description: Human values and safety concerns should be treated as first-class, verifiable requirements. These projects put that conviction to work.


#-------------------------------
# News Section (home page). Add new items at the top.
news:
  enable: true
  news_title: Latest <em>News</em>

news_items:
  - date: 2026
    text: Our paper <em>From Business Problems to AI Solutions</em> was accepted at the IEEE International Requirements Engineering Conference (RE'26), held at ÉTS in Montréal.
  - date: 2026
    text: Co-organizing the HCARE 2026 workshop on human-centered AI and requirements engineering.
  - date: 2026
    text: Paper on migrating QAOA implementations from Qiskit 1.x to 2.x presented at the Q-SE workshop at ICSE 2026, Rio de Janeiro.
  - date: 2026
    text: New NSERC Alliance International Catalyst grant in quantum software engineering, with Shaukat Ali (Simula / OsloMet).


