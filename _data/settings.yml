#-------------------------------
# Sidebar Section Settings
sidebar:
  sidebar_title: Engineering software that <em>respects</em> people. # You can add an 'em' element to highlight text.
  sidebar_description: I am an Associate Professor in the Department of Software Engineering and IT at the École de technologie supérieure (ÉTS) in Montréal, and a member of the SOFEESS and LATECE labs. I work in requirements engineering, treating human values and safety as first-class, verifiable requirements, from AI agents to quantum systems.


